# =====================================================
# CONFIGURATION DE BASE DE LA GATEWAY
# =====================================================

# Port sur lequel la gateway va écouter
server.port=8080

# Nom du service dans l'écosystème Eureka
spring.application.name=gateway-service

# WebFlux obligatoire pour que Spring Cloud Gateway fonctionne (pas de spring-boot-starter-web ici)
spring.main.web-application-type=reactive

# =====================================================
# CONFIGURATION EUREKA CLIENT (inscription au registre)
# =====================================================

# Adresse de l'Eureka Server (où on s'enregistre)
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# Pour éviter les problèmes de nom DNS dans Docker : on préfère l'IP de l'instance dans l'enregistrement
eureka.instance.prefer-ip-address=true

# =====================================================
# ROUTING DE LA GATEWAY (DÉCLARATION DES ROUTES)
# =====================================================

# Route 1 : vers le microservice auteur
spring.cloud.gateway.routes[0].id=auteur-service
spring.cloud.gateway.routes[0].uri=lb://auteur-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auteurs/**

# Route 2 : vers les livres gérés dans le microservice auteur
spring.cloud.gateway.routes[1].id=livre-auteur-service
spring.cloud.gateway.routes[1].uri=lb://auteur-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/livres/**

# Route 3 : vers les clients (microservice livre)
spring.cloud.gateway.routes[2].id=client-livre-service
spring.cloud.gateway.routes[2].uri=lb://livre-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/clients/**

# Route 4 : vers les commandes (microservice livre)
spring.cloud.gateway.routes[3].id=commande-livre-service
spring.cloud.gateway.routes[3].uri=lb://livre-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/commandes/**

# =====================================================
# OPTIONS DIVERS UTILES
# =====================================================

# Désactive le mapping automatique des fichiers dans /static (pas utile ici)
spring.web.resources.add-mappings=false

# Désactive la vérif des templates Thymeleaf (inutile dans une API gateway sans frontend)
spring.thymeleaf.check-template-location=false

# =====================================================
# LOGGING POUR LE DEBUG
# =====================================================

# Active les logs détaillés de Gateway (routes, filtres, matching)
logging.level.org.springframework.cloud.gateway=DEBUG

# Active les logs pour voir quelles routes sont déclenchées
logging.level.org.springframework.cloud.gateway.handler.RoutePredicateHandlerMapping=TRACE
