# Port d'écoute du serveur Eureka
server.port=8761

# Nom du service Eureka (apparaît dans le dashboard)
spring.application.name=eureka-server

# Désactive l'enregistrement de lui-même (Eureka ne s'enregistre pas chez lui-même)
eureka.client.register-with-eureka=false

# Désactive la récupération du registre chez d'autres instances (vu qu'il est seul)
eureka.client.fetch-registry=false

# Pour éviter les problèmes avec les conteneurs Docker
eureka.instance.hostname=eureka-server
eureka.instance.prefer-ip-address=true

# (Optionnel mais propre) — désactive la sécurité CSRF et rend le dashboard utilisable plus facilement
spring.security.user.name=admin
spring.security.user.password=admin
management.endpoints.web.exposure.include=*
